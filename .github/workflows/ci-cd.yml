name: CI/CD Pipeline - Billets

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'
  FLY_APP_NAME: 'billets-api'
  VERCEL_PROJECT_NAME: 'billets'

jobs:
  # Frontend: Lint, Typecheck, Build
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 7

  # Backend: Test, Lint
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run API tests
        run: python test_nvidia_api.py
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}

      - name: Check imports
        run: python -c "import main; import ai_service; import pdf_parser; print('All imports OK')"

  # Deploy Frontend to Vercel
  deploy-frontend:
    needs: frontend
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist/

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: .

  # Deploy Backend to Fly.io
  deploy-backend:
    needs: backend
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Fly.io
        uses: superfly/flyctl-actions@1.5
        with:
          args: "deploy --config fly.toml --app ${{ env.FLY_APP_NAME }} --remote-only --yes"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}

      - name: Set NVIDIA_API_KEY secret on Fly.io
        uses: superfly/flyctl-actions@1.5
        with:
          args: "secrets set NVIDIA_API_KEY=${{ secrets.NVIDIA_API_KEY }} --app ${{ env.FLY_APP_NAME }}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Get Fly.io app URL
        id: fly-url
        uses: superfly/flyctl-actions@1.5
        with:
          args: "status --app ${{ env.FLY_APP_NAME }} --json"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Output Fly.io URL
        run: |
          echo "Fly.io app deployed!"
          echo "Hostname will be: https://${{ env.FLY_APP_NAME }}.fly.dev"